<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Latihan CI/CD - Rizqi Akbar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 60%, #020617 100%);
      color: #f8fafc;
    }
    .card {
      width: 100%;
      max-width: 520px;
      padding: 36px 32px;
      border-radius: 16px;
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.3);
      margin-bottom: 20px;
    }
    h1 { font-size: 2rem; margin-bottom: 10px; }
    p { color: #cbd5e1; line-height: 1.6; margin-bottom: 24px; }
    .meta {
      display: flex;
      justify-content: space-between;
      padding-top: 16px;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">GITHUB REPO</div>
    <h1>Halo, ini web latihan CI/CD</h1>
    <p>Versi 3 - otomatis dari Jenkins</p>
    <div class="meta">
      <span>Rizqi Akbar (CodeXjava)</span>
      <span>157.15.124.42</span>
    </div>
  </main>
</body>
</html>
